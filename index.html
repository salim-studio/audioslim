<!doctype html>
<html lang="en" data-theme-resolved="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('audioslim:prefs') || '{}').theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0e13" />
    <title>audioslim+</title>
    <meta name="description" content="audioslim+ is a waveform and multitrack audio editor in your browser. Record, edit, restore, mix and master audio, with spectral editing and studio effects. Everything runs on your device." />
    <meta name="keywords" content="online audio editor, multitrack audio editor, waveform editor, spectral editor, noise reduction, record audio online, podcast editor" />
    <link rel="canonical" href="https://salim-studio.github.io/audioslim/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="audioslim+" />
    <meta property="og:title" content="audioslim+: waveform and multitrack audio editing in your browser" />
    <meta property="og:description" content="Record, edit, restore, mix and master audio in the browser. Everything stays on your device." />
    <meta property="og:url" content="https://salim-studio.github.io/audioslim/" />
    <meta property="og:image" content="https://salim-studio.github.io/audioslim/social-graph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="audioslim+" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <noscript>audioslim+ needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
